<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="오늘의 날씨를 실시간으로 확인하세요">
  <title>오늘의 날씨</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow: hidden;
    }

    /* Animated background orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .bg-orb:nth-child(1) {
      width: 400px; height: 400px;
      background: #667eea;
      top: -100px; left: -100px;
      animation-delay: 0s;
    }
    .bg-orb:nth-child(2) {
      width: 300px; height: 300px;
      background: #f093fb;
      bottom: -80px; right: -80px;
      animation-delay: -3s;
    }
    .bg-orb:nth-child(3) {
      width: 250px; height: 250px;
      background: #4facfe;
      top: 50%; left: 60%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* Card */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 48px 40px;
      width: 420px;
      max-width: 92vw;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: cardIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .card h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
    }

    .location {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .location::before {
      content: '📍';
      font-size: 1.2rem;
    }

    /* Weather icon */
    .weather-icon {
      font-size: 5rem;
      margin: 8px 0 16px;
      animation: bounce 3s ease-in-out infinite;
      line-height: 1.2;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .temperature {
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .description {
      font-size: 1.15rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 32px;
    }

    /* Detail grid */
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 16px 12px;
      transition: background 0.3s;
    }
    .detail-item:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .detail-item .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      margin-bottom: 6px;
    }
    .detail-item .value {
      font-size: 1.25rem;
      font-weight: 600;
    }

    /* Loading */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #a5b4fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader p {
      color: rgba(255,255,255,0.6);
      font-size: 0.95rem;
    }

    /* Error */
    .error-msg {
      color: #fca5a5;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 10px 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .retry-btn:hover {
      background: rgba(255,255,255,0.18);
    }

    .date-time {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>

  <div class="card" id="weatherCard">
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <p>날씨 정보를 불러오는 중...</p>
    </div>
  </div>

  <script>
    // Weather code → emoji & description mapping (WMO codes)
    const weatherInfo = {
      0:  { icon: '☀️', desc: '맑음' },
      1:  { icon: '🌤️', desc: '대체로 맑음' },
      2:  { icon: '⛅', desc: '부분적 흐림' },
      3:  { icon: '☁️', desc: '흐림' },
      45: { icon: '🌫️', desc: '안개' },
      48: { icon: '🌫️', desc: '짙은 안개' },
      51: { icon: '🌦️', desc: '가벼운 이슬비' },
      53: { icon: '🌦️', desc: '이슬비' },
      55: { icon: '🌦️', desc: '강한 이슬비' },
      61: { icon: '🌧️', desc: '약한 비' },
      63: { icon: '🌧️', desc: '비' },
      65: { icon: '🌧️', desc: '강한 비' },
      71: { icon: '🌨️', desc: '약한 눈' },
      73: { icon: '🌨️', desc: '눈' },
      75: { icon: '❄️', desc: '강한 눈' },
      77: { icon: '🌨️', desc: '싸락눈' },
      80: { icon: '🌧️', desc: '약한 소나기' },
      81: { icon: '🌧️', desc: '소나기' },
      82: { icon: '⛈️', desc: '강한 소나기' },
      85: { icon: '🌨️', desc: '약한 눈보라' },
      86: { icon: '❄️', desc: '눈보라' },
      95: { icon: '⛈️', desc: '뇌우' },
      96: { icon: '⛈️', desc: '우박 동반 뇌우' },
      99: { icon: '⛈️', desc: '강한 우박 뇌우' },
    };

    function getWeatherMeta(code) {
      return weatherInfo[code] || { icon: '🌡️', desc: '알 수 없음' };
    }

    function windDirection(deg) {
      const dirs = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function formatDateTime() {
      const now = new Date();
      const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      return now.toLocaleDateString('ko-KR', opts);
    }

    async function reverseGeocode(lat, lon) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`
        );
        const data = await res.json();
        const addr = data.address;
        return addr.city || addr.town || addr.county || addr.state || '내 위치';
      } catch {
        return `${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
      }
    }

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m` +
        `&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API 요청 실패');
      return res.json();
    }

    function renderWeather(data, locationName) {
      const c = data.current;
      const meta = getWeatherMeta(c.weather_code);
      const card = document.getElementById('weatherCard');

      card.innerHTML = `
        <h1>오늘의 날씨</h1>
        <div class="location">${locationName}</div>
        <div class="weather-icon">${meta.icon}</div>
        <div class="temperature">${Math.round(c.temperature_2m)}°</div>
        <div class="description">${meta.desc} · 체감 ${Math.round(c.apparent_temperature)}°</div>
        <div class="details">
          <div class="detail-item">
            <div class="label">💧 습도</div>
            <div class="value">${c.relative_humidity_2m}%</div>
          </div>
          <div class="detail-item">
            <div class="label">💨 바람</div>
            <div class="value">${c.wind_speed_10m} km/h</div>
          </div>
          <div class="detail-item">
            <div class="label">🌡️ 현재 기온</div>
            <div class="value">${c.temperature_2m}°C</div>
          </div>
          <div class="detail-item">
            <div class="label">🧭 풍향</div>
            <div class="value">${windDirection(c.wind_direction_10m)}</div>
          </div>
        </div>
        <div class="date-time">${formatDateTime()}</div>
      `;
    }

    function showError(msg) {
      document.getElementById('weatherCard').innerHTML = `
        <h1>오늘의 날씨</h1>
        <div class="error-msg">${msg}</div>
        <button class="retry-btn" onclick="init()">다시 시도</button>
      `;
    }

    async function init() {
      document.getElementById('weatherCard').innerHTML = `
        <div class="loader" id="loader">
          <div class="spinner"></div>
          <p>날씨 정보를 불러오는 중...</p>
        </div>
      `;

      if (!navigator.geolocation) {
        showError('이 브라우저에서는 위치 서비스를 사용할 수 없습니다.');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          try {
            const { latitude: lat, longitude: lon } = pos.coords;
            const [data, locationName] = await Promise.all([
              fetchWeather(lat, lon),
              reverseGeocode(lat, lon),
            ]);
            renderWeather(data, locationName);
          } catch (e) {
            showError('날씨 데이터를 가져올 수 없습니다.<br>인터넷 연결을 확인해주세요.');
          }
        },
        () => {
          showError('위치 접근이 거부되었습니다.<br>브라우저 설정에서 위치 권한을 허용해주세요.');
        },
        { enableHighAccuracy: false, timeout: 10000 }
      );
    }

    init();
  </script>
</body>
</html>
